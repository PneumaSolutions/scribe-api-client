[package]
name = "scribe-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust client for the Scribe document conversion API"
readme = "README.md"
homepage = "https://scribeit.io"
documentation = "https://docs.rs/scribe-client"
keywords = ["scribe", "accessibility", "daisy", "braille", "epub"]
categories = ["api-bindings", "accessibility", "web-programming::http-client"]

[lints]
workspace = true

[features]
default = ["rustls"]
# TLS by rustls, with no system library to link against: what the wheels on
# PyPI are built with, and the simplest choice for anyone else.
rustls = ["reqwest/rustls", "tokio-tungstenite/rustls-tls-native-roots"]
# TLS by the platform's own library (Security.framework on Apple, SChannel on
# Windows, OpenSSL elsewhere).
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]

[dependencies]
base64 = "0.22.1"
futures-util = { version = "0.3.32", default-features = false, features = ["sink"] }
percent-encoding = "2.3.2"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["serde", "parsing", "formatting"] }
tokio = { version = "1.52.3", features = ["rt", "macros", "sync"] }
tokio-tungstenite = "0.29.0"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net"] }
wiremock = "0.6.5"
