[package]
name = "scribe-client-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not on crates.io: the Python package goes to PyPI, and only
# scribe-client is published to crates.io.
publish = false
description = "Python bindings (PyO3) for scribe-client"

[lib]
name = "scribe_client"
crate-type = ["cdylib"]

[lints]
workspace = true

[build-dependencies]
pyo3-build-config = "0.29.0"

[dependencies]
scribe_client_core = { package = "scribe-client", path = "../scribe-client" }
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py39"] }
pythonize = "0.29.0"
# rustls, as scribe-client defaults to: OpenSSL would have to be built into
# every Linux wheel.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls"] }
serde_json = "1.0.150"
time = "0.3.53"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
url = "2.5.8"
